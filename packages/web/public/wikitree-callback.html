<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing in to WikiTree…</title>
  </head>
  <body>
    <p>Signing in to WikiTree…</p>
    <script>
      // WikiTree's clientLogin returns ?authcode=… on this static page, because HashRouter
      // would not see a query string placed before the hash. Stash it for the app and
      // replace this history entry so the authcode never stays in the back stack.
      // Relative paths, so it works under any base path (/share/, /recordseek-app/).
      (function () {
        var authcode = new URLSearchParams(window.location.search).get('authcode');
        if (authcode) {
          try {
            sessionStorage.setItem('rs_wikitree_authcode', authcode);
          } catch (e) {
            /* storage blocked: the app will ask to sign in again */
          }
        }
        window.location.replace('./#/wikitree');
      })();
    </script>
  </body>
</html>
